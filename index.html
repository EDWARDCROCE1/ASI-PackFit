<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>ASI PackFit Shipping Calculator</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="theme-color" content="#111111">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="PackFit">
<style>
  :root{--bg:#f3f6f8;--panel:#ffffff;--panel2:#eef3f6;--text:#111827;--muted:#64748b;--accent:#0d8dcc;--accent2:#f47b20;--danger:#b42318;--border:#cbd5e1}
  *{box-sizing:border-box}
  body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;background:linear-gradient(180deg,#ffffff,#eef4f7);color:var(--text);min-height:100vh}
  .wrap{max-width:1000px;margin:auto;padding:24px}
  h1{margin:0 0 6px;font-size:clamp(2rem,5vw,3.4rem)}
  .sub{color:var(--muted);margin:0 0 24px}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:18px}
  .card{background:rgba(255,255,255,.97);border:1px solid var(--border);border-radius:18px;padding:18px;box-shadow:0 18px 45px rgba(0,0,0,.22)}
  label{display:block;font-size:.9rem;color:var(--muted);margin-bottom:6px}
  input,select,button{width:100%;border-radius:12px;border:1px solid var(--border);padding:13px 14px;font-size:1rem}
  input,select{background:#ffffff;color:var(--text);outline:none}
  input:focus,select:focus{border-color:var(--accent2);box-shadow:0 0 0 3px rgba(56,189,248,.12)}
  .row3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
  .row2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  button{border:0;background:var(--accent);color:white;font-weight:800;cursor:pointer;margin-top:12px}
  button.secondary{background:#eef3f6;color:var(--text);border:1px solid var(--border)}
  button.danger{background:#fff1f0;color:#b42318;border:1px solid #f3b7b1}
  .results{margin-top:18px}
  .winner{border:1px solid #7cc5e7;background:#edf8fd;padding:16px;border-radius:16px}
  .winner h2{margin:0 0 8px}
  .metric{display:flex;justify-content:space-between;gap:16px;padding:8px 0;border-bottom:1px solid rgba(148,163,184,.15)}
  .metric:last-child{border-bottom:0}
  .metric span:first-child{color:var(--muted)}
  .alt{margin-top:14px;padding:12px;border:1px solid var(--border);border-radius:12px;background:#f8fafc}
  .inventory{max-height:460px;overflow:auto}
  .boxrow{display:grid;grid-template-columns:1fr auto auto;align-items:center;gap:8px;padding:10px 0;border-bottom:1px solid rgba(148,163,184,.12)}
  .boxrow small{color:var(--muted)}
  .pill{padding:5px 9px;border-radius:999px;font-size:.78rem;background:#f8fafc;border:1px solid var(--border)}
  .empty{color:var(--muted);padding:10px 0}
  .footer{color:var(--muted);text-align:center;font-size:.85rem;margin-top:22px}
  @media(max-width:760px){.grid{grid-template-columns:1fr}.row3{grid-template-columns:1fr 1fr 1fr}.wrap{padding:16px}}
</style>
</head>
<body>
<div class="wrap">
  <div style="display:flex;align-items:center;gap:16px;margin-bottom:8px;flex-wrap:wrap">
    <img src="asi-logo.png" alt="Aeronautical Systems Inc." style="width:min(260px,68vw);height:auto;display:block">
    <div>
      <h1 style="margin:0">PackFit</h1>
      <p class="sub" style="margin:2px 0 0">ASI Shipping Carton Optimizer</p>
    </div>
  </div>
  <div id="installNote" class="card" style="display:none;margin:14px 0 18px;padding:12px 14px;border-left:4px solid var(--accent2)">
    <strong>Install on iPhone:</strong> open this page in Safari, tap the Share button, then choose <strong>Add to Home Screen</strong>.
  </div>

  <div class="grid">
    <section class="card">
      <h2>Shipment</h2>
      <div class="row3">
        <div><label>Length (in)</label><input id="itemL" type="number" step="0.01" value="9"></div>
        <div><label>Width (in)</label><input id="itemW" type="number" step="0.01" value="5.5"></div>
        <div><label>Height (in)</label><input id="itemH" type="number" step="0.01" value="5.5"></div>
      </div>
      <div class="row2" style="margin-top:10px">
        <div><label>Quantity</label><input id="qty" type="number" min="1" step="1" value="63"></div>
        <div><label>Padding allowance per side (in)</label><input id="padding" type="number" min="0" step="0.25" value="0"></div>
      </div>
      <div class="row2" style="margin-top:10px">
        <div><label>Maximum cartons</label><select id="maxCartons"><option>1</option><option>2</option><option selected>3</option><option value="10">Any</option></select></div>
        <div><label>Optimize for</label><select id="optimize"><option value="cartons">Fewest cartons</option><option value="volume">Least unused space</option></select></div>
      </div>
      <button onclick="calculate()">CALCULATE BEST FIT</button>
      <div id="results" class="results"></div>
    </section>

    <section class="card">
      <h2>Shipping Box Inventory</h2>
      <div class="row3">
        <div><label>L</label><input id="newL" type="number" step="0.01"></div>
        <div><label>W</label><input id="newW" type="number" step="0.01"></div>
        <div><label>H</label><input id="newH" type="number" step="0.01"></div>
      </div>
      <button class="secondary" onclick="addBox()">+ Add Carton Size</button>
      <div id="inventory" class="inventory"></div>
      <button class="danger" onclick="resetInventory()">Reset Default Inventory</button>
    </section>
  </div>
  <div class="footer">ASI PackFit v2.0 • Works offline after first load • Data stays on this device.</div>
</div>

<script>
const defaults = [
[36,24,24],[32,24,24],[32,32,32],[36,18,18],[28,18,18],[25,25,25],[26,26,12],
[30,15,15],[30,20,20],[24,16,12],[24,18,6],[24,12,12],[30,12,12],[28,12,6]
];
let inventory = JSON.parse(localStorage.getItem('packfit_inventory') || 'null') || defaults.map((d,i)=>({id:Date.now()+i,l:d[0],w:d[1],h:d[2],active:true}));

function save(){ localStorage.setItem('packfit_inventory', JSON.stringify(inventory)); renderInventory(); }
function dims(b){return `${b.l} × ${b.w} × ${b.h}`}
function renderInventory(){
  const el=document.getElementById('inventory'); el.innerHTML='';
  inventory.forEach(b=>{
    const r=document.createElement('div'); r.className='boxrow';
    r.innerHTML=`<div><strong>${dims(b)}</strong><br><small>${b.active?'Available':'Out of stock'}</small></div>
      <button class="secondary" style="width:auto;margin:0;padding:7px 10px" onclick="toggleBox(${b.id})">${b.active?'Disable':'Enable'}</button>
      <button class="danger" style="width:auto;margin:0;padding:7px 10px" onclick="removeBox(${b.id})">×</button>`;
    el.appendChild(r);
  });
}
function toggleBox(id){const b=inventory.find(x=>x.id===id); if(b){b.active=!b.active;save()}}
function removeBox(id){inventory=inventory.filter(x=>x.id!==id);save()}
function addBox(){
  const l=+newL.value,w=+newW.value,h=+newH.value;
  if(!(l>0&&w>0&&h>0)) return alert('Enter all three carton dimensions.');
  inventory.push({id:Date.now(),l,w,h,active:true}); save(); newL.value=newW.value=newH.value='';
}
function resetInventory(){inventory=defaults.map((d,i)=>({id:Date.now()+i,l:d[0],w:d[1],h:d[2],active:true}));save()}
function perms(a,b,c){return [[a,b,c],[a,c,b],[b,a,c],[b,c,a],[c,a,b],[c,b,a]]}
function capacity(box,item,pad){
  let best=null;
  for(const [a,b,c] of perms(item.l+2*pad,item.w+2*pad,item.h+2*pad)){
    const x=Math.floor(box.l/a), y=Math.floor(box.w/b), z=Math.floor(box.h/c); const cap=x*y*z;
    if(cap>0 && (!best || cap>best.cap)) best={cap,x,y,z,orient:[a,b,c]};
  }
  return best;
}
function calculate(){
  const item={l:+itemL.value,w:+itemW.value,h:+itemH.value}, q=+qty.value, pad=+padding.value||0, max=+maxCartons.value;
  if(!(item.l>0&&item.w>0&&item.h>0&&q>0)) return alert('Enter valid item dimensions and quantity.');
  const active=inventory.filter(b=>b.active).map(b=>{const p=capacity(b,item,pad); return p?{...b,...p,volume:b.l*b.w*b.h}:null}).filter(Boolean);
  const candidates=[];
  for(const b of active){
    const cartons=Math.ceil(q/b.cap); if(cartons<=max){ const totalCap=cartons*b.cap; candidates.push({b,cartons,totalCap,wasteSlots:totalCap-q,wasteVolume:cartons*b.volume-q*item.l*item.w*item.h}); }
  }
  const mode=optimize.value;
  candidates.sort((a,b)=> mode==='cartons' ? (a.cartons-b.cartons || a.wasteVolume-b.wasteVolume) : (a.wasteVolume-b.wasteVolume || a.cartons-b.cartons));
  const out=document.getElementById('results');
  if(!candidates.length){out.innerHTML='<div class="alt"><strong>No fit found.</strong><br><span style="color:var(--muted)">Try more cartons, reduce padding, or add another shipping box size.</span></div>';return}
  const c=candidates[0], packed=Math.min(q,c.b.cap), last=q-c.b.cap*(c.cartons-1);
  out.innerHTML=`<div class="winner"><h2>✅ Best Fit: ${c.cartons} carton${c.cartons>1?'s':''}</h2>
    <div class="metric"><span>Carton size</span><strong>${dims(c.b)}</strong></div>
    <div class="metric"><span>Capacity per carton</span><strong>${c.b.cap}</strong></div>
    <div class="metric"><span>Packing layout</span><strong>${c.b.x} × ${c.b.y} × ${c.b.z}</strong></div>
    <div class="metric"><span>Item orientation</span><strong>${c.b.orient.join(' × ')}</strong></div>
    <div class="metric"><span>Distribution</span><strong>${c.cartons===1?q:`${c.cartons-1} carton(s) × ${c.b.cap}, last carton × ${last}`}</strong></div>
    <div class="metric"><span>Unused unit slots</span><strong>${c.wasteSlots}</strong></div></div>`;
  const alts=candidates.slice(1,4);
  if(alts.length){ out.innerHTML += '<div class="alt"><strong>Alternatives</strong>'+alts.map(a=>`<div class="metric"><span>${dims(a.b)}</span><strong>${a.cartons} carton${a.cartons>1?'s':''} • ${a.b.cap}/carton</strong></div>`).join('')+'</div>'; }
}
renderInventory(); calculate();

// PWA + iPhone install support
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => navigator.serviceWorker.register('./sw.js'));
}
const standalone = window.matchMedia('(display-mode: standalone)').matches || window.navigator.standalone === true;
const isiOS = /iphone|ipad|ipod/i.test(navigator.userAgent);
if (isiOS && !standalone) document.getElementById('installNote').style.display='block';
</script>
</body>
</html>
